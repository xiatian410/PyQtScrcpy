name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libxcb-cursor0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Verify generated UI
        shell: bash
        run: |
          pyuic6 mainWindow.ui -o mainWindow.py
          git diff --exit-code -- mainWindow.py
      - name: Install verified components
        run: python scripts/update_components.py
      - run: python -m pytest -q
      - name: Check component versions
        run: python scripts/check_components.py
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/update_components.py
      - run: python -m PyInstaller --noconfirm PyQtScrcpy.spec
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PyQtScrcpy-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
